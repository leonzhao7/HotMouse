services:
  tsec:
    image: ${HOTMOUSE_IMAGE:-hotmouse-tsec:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: tsec
    # Linux host networking shares the VPN routes, DNS and local model gateway.
    network_mode: host
    # Load file values with `docker compose --env-file docker/.tsec.env ...`.
    # Compose then gives startup environment values priority over that file.
    # Use unset-only defaults so explicit empty strings and zero survive.
    environment:
      HOTMOUSE_WORKER_DRIVER: pi
      BENCHMARK_BASE_URL: "${BENCHMARK_BASE_URL-}"
      BENCHMARK_TOKEN: "${BENCHMARK_TOKEN-}"
      HOTMOUSE_LLM_BASE_URL: "${HOTMOUSE_LLM_BASE_URL-http://127.0.0.1:8000/v1}"
      HOTMOUSE_LLM_API_KEY: "${HOTMOUSE_LLM_API_KEY-}"
      HOTMOUSE_LLM_MODEL: "${HOTMOUSE_LLM_MODEL-}"
      HOTMOUSE_LLM_API: "${HOTMOUSE_LLM_API-openai}"
      HOTMOUSE_LLM_REASONING_EFFORT: "${HOTMOUSE_LLM_REASONING_EFFORT-}"
      TSEC_VPN_MODE: "${TSEC_VPN_MODE-external}"
      TSEC_NETWORK_CHECK_URL: "${TSEC_NETWORK_CHECK_URL-}"
      TSEC_TARGET_PROBE_ENABLED: "${TSEC_TARGET_PROBE_ENABLED-0}"
      HOTMOUSE_COMPETITION_CONCURRENCY: "${HOTMOUSE_COMPETITION_CONCURRENCY-3}"
      HOTMOUSE_COMPETITION_MAX_WORKERS: "${HOTMOUSE_COMPETITION_MAX_WORKERS-3}"
      HOTMOUSE_PROJECT_CONCURRENCY: "${HOTMOUSE_PROJECT_CONCURRENCY-3}"
      HOTMOUSE_PROJECT_MAX_WORKERS: "${HOTMOUSE_PROJECT_MAX_WORKERS-3}"
      HOTMOUSE_WORKER_COUNT: "${HOTMOUSE_WORKER_COUNT-16}"
      HOTMOUSE_PROJECT_BUDGET_SECONDS: "${HOTMOUSE_PROJECT_BUDGET_SECONDS-0}"
      HOTMOUSE_COMPETITION_CHALLENGE_TIMEOUT: "${HOTMOUSE_COMPETITION_CHALLENGE_TIMEOUT-30m}"
      TSEC_RETRY_INTERVAL: "${TSEC_RETRY_INTERVAL-8s}"
      TSEC_SHUTDOWN_TIMEOUT: "${TSEC_SHUTDOWN_TIMEOUT-30s}"
      TSEC_RESULT_FILE: "${TSEC_RESULT_FILE-/data/tsec-result.json}"
      HOTMOUSE_LOG_LEVEL: "${HOTMOUSE_LOG_LEVEL-info}"
      HOTMOUSE_LOG_ENV: "${HOTMOUSE_LOG_ENV-0}"
      HOTMOUSE_COMPETITION_RULES_FILE: "${HOTMOUSE_COMPETITION_RULES_FILE-}"
    volumes:
      - tsec-data:/data
      - tsec-home:/home/node
    restart: "on-failure:3"
    stop_grace_period: 45s

volumes:
  tsec-data:
  tsec-home:
