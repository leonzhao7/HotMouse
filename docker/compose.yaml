services:
  hotmouse:
    image: ${HOTMOUSE_IMAGE:-hotmouse:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${HOTMOUSE_BIND_ADDRESS:-127.0.0.1}:${HOTMOUSE_PORT:-9981}:9981"
    environment:
      HOTMOUSE_AUTORUN: "${HOTMOUSE_AUTORUN:-1}"
      HOTMOUSE_AUTH_REQUIRED: "${HOTMOUSE_AUTH_REQUIRED:-1}"
      HOTMOUSE_LOG_LEVEL: "${HOTMOUSE_LOG_LEVEL:-debug}"
      HOTMOUSE_LOG_ENV: "${HOTMOUSE_LOG_ENV:-1}"
      HOTMOUSE_WORKER_DRIVER: pi
      HOTMOUSE_LLM_BASE_URL: "${HOTMOUSE_LLM_BASE_URL:-${PI_BASE_URL:-}}"
      HOTMOUSE_LLM_API_KEY: "${HOTMOUSE_LLM_API_KEY:-${PI_API_KEY:-}}"
      HOTMOUSE_LLM_MODEL: "${HOTMOUSE_LLM_MODEL:-${PI_MODEL:-}}"
      HOTMOUSE_LLM_API: "${HOTMOUSE_LLM_API:-${PI_PROVIDER_API:-}}"
      HOTMOUSE_LLM_REASONING_EFFORT: "${HOTMOUSE_LLM_REASONING_EFFORT:-}"
      PI_MODEL_CONTEXT_WINDOW: "${PI_MODEL_CONTEXT_WINDOW:-}"
      HOTMOUSE_WORKER_COUNT: "${HOTMOUSE_WORKER_COUNT:-}"
      HOTMOUSE_PROJECT_CONCURRENCY: "${HOTMOUSE_PROJECT_CONCURRENCY:-${HOTMOUSE_COMPETITION_CONCURRENCY:-1}}"
      HOTMOUSE_PROJECT_MAX_WORKERS: "${HOTMOUSE_PROJECT_MAX_WORKERS:-${HOTMOUSE_COMPETITION_MAX_WORKERS:-1}}"
      HOTMOUSE_PROJECT_BUDGET_SECONDS: "${HOTMOUSE_PROJECT_BUDGET_SECONDS:-}"
      HOTMOUSE_DECIDE_TIMEOUT_SECONDS: "${HOTMOUSE_DECIDE_TIMEOUT_SECONDS:-}"
      HOTMOUSE_EXECUTE_TIMEOUT_SECONDS: "${HOTMOUSE_EXECUTE_TIMEOUT_SECONDS:-}"
      HOTMOUSE_CONCLUDE_TIMEOUT_SECONDS: "${HOTMOUSE_CONCLUDE_TIMEOUT_SECONDS:-}"
      HOTMOUSE_CONCLUDE_RESERVE_SECONDS: "${HOTMOUSE_CONCLUDE_RESERVE_SECONDS:-}"
      HOTMOUSE_RECOVERY_ATTEMPTS: "${HOTMOUSE_RECOVERY_ATTEMPTS:-}"
      HOTMOUSE_FORMAT_RETRIES: "${HOTMOUSE_FORMAT_RETRIES:-}"
      HOTMOUSE_BASH_TIMEOUT_SECONDS: "${HOTMOUSE_BASH_TIMEOUT_SECONDS:-}"
      HOTMOUSE_STEP_TIMEOUT_SECONDS: "${HOTMOUSE_STEP_TIMEOUT_SECONDS:-}"
      HOTMOUSE_DECIDE_LEASE_TIMEOUT_SECONDS: "${HOTMOUSE_DECIDE_LEASE_TIMEOUT_SECONDS:-}"
      HOTMOUSE_WORKER_UNHEALTHY_RETRY_AFTER_SECONDS: "${HOTMOUSE_WORKER_UNHEALTHY_RETRY_AFTER_SECONDS:-}"
      HOTMOUSE_WORKER_REJECTED_RETRY_AFTER_SECONDS: "${HOTMOUSE_WORKER_REJECTED_RETRY_AFTER_SECONDS:-}"
      BENCHMARK_BASE_URL: "${BENCHMARK_BASE_URL:-}"
      BENCHMARK_TOKEN: "${BENCHMARK_TOKEN:-}"
      HOTMOUSE_COMPETITION_RULES_FILE: "${HOTMOUSE_COMPETITION_RULES_FILE:-}"
      HOTMOUSE_COMPETITION_PLATFORM: "${HOTMOUSE_COMPETITION_PLATFORM:-tsec}"
      HOTMOUSE_COMPETITION_CONCURRENCY: "${HOTMOUSE_COMPETITION_CONCURRENCY:-}"
      HOTMOUSE_COMPETITION_MAX_WORKERS: "${HOTMOUSE_COMPETITION_MAX_WORKERS:-}"
      HOTMOUSE_COMPETITION_CHALLENGE_TIMEOUT: "${HOTMOUSE_COMPETITION_CHALLENGE_TIMEOUT:-20m}"
    volumes:
      - hotmouse-data:/data
      - hotmouse-home:/home/node
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  hotmouse-data:
  hotmouse-home:
